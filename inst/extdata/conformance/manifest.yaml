  - id: hy_all_terminals
    function: hy
    fixture: all_terminals.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # probed: zero rows, id and toid integer, R class hy_topo
  - id: hy_empty_network
    function: hy
    fixture: empty_network.gpkg
