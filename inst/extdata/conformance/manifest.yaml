  # (TRUE after hy()); Python may return True
  - id: is_hy_empty_network
    function: is.hy
    fixture: empty_network.gpkg
    args: {silent: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # shared: false; S-6 single-row network
  - id: is_hy_boundary_single_row
    function: is.hy
