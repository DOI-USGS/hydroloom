# hydroloom conformance manifest (SPEC S-4); schema: manifest.schema.json
suite_version: 0.1.0
functions:
  hy:
    requires: algorithms/hy.md#requires
    returns: frame
  hy_reverse:
    requires: algorithms/hy_reverse.md#requires
    returns: frame
  is.hy:
    requires: algorithms/is.hy.md#requires
    returns: scalar
  align_names:
    requires: algorithms/align_names.md#requires
    returns: frame
  hydroloom_name_definitions:
    requires: algorithms/hydroloom_name_definitions.md#requires
    returns: frame
    key: [name]
  # A named character vector becomes a frame of name, value in vector order
  # (D3-13).
  hydroloom_names:
    requires: algorithms/hydroloom_names.md#requires
    returns: frame
    key: [name, value]
  hy_network_type:
    requires: algorithms/hy_network_type.md#requires
    returns: scalar
  # A named logical vector until A-4: a frame of name, value in vector order
  # (D3-13); after A-4, function, available, via.
  hy_capabilities:
    requires: algorithms/hy_capabilities.md#requires
    returns: frame
  is_dendritic:
    requires: algorithms/is_dendritic.md#requires
    returns: scalar
  add_toids:
    requires: algorithms/add_toids.md#requires
    returns: frame
  # key omits mode: single-mode layers have no mode column; the radix sort is
  # stable, so "to" rows stay before "from" rows in a mode "both" layer.
  make_index_ids:
    requires: algorithms/make_index_ids.md#requires
    returns: graph
    key: [id, position, neighbor]
  # TRUE on a clean network is written by the frame converter as the scalar
  # value layer (D3-53); problem rows otherwise.
  check_hy_graph:
    requires: algorithms/check_hy_graph.md#requires
    returns: frame
  sort_network:
    requires: algorithms/sort_network.md#requires
    returns: frame
  add_topo_sort:
    requires: algorithms/add_topo_sort.md#requires
    returns: frame
  # One element per unique start, split into paths; the traversal layer adds
  # a 0-based path column (D2-08). Python's direction_invalid has no R
  # counterpart (R walks downstream for an unknown direction); the
  # non-frame, non-list input stays a testthat interface test.
  navigate_network_dfs:
    requires: algorithms/navigate_network_dfs.md#requires
    returns: traversal
    key: [start, order]
cases:
  # hy ------------------------------------------------------------------------
  # Annotations from the proposed cases (D3-14) are kept as comments:
  # changes_with i2 = the layer was set by identifier ingest (ROADMAP §4, M3),
  # which has landed; python_omitted =
  # uses clean or add_topo, which as_hy omits (A-5).

  # changes_with: i2 (fromnode/tonode double -> integer)
  # M-18: start_flag, terminal_flag arrive integer 1/0 and are logical
  # geometry: the one layer that keeps geometry, checking G-14 pass-through
  # (S-5, D3-79); every other layer stores attributes only
  - id: hy_new_hope_default
    function: hy
    fixture: new_hope.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r, python]
    generator: [r]
    geometry: true
    columns: [id, start_flag, terminal_flag]

  # python_omitted; changes_with: i2
