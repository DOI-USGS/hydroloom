  - id: hy_reverse_all_terminals
    function: hy_reverse
    fixture: all_terminals.gpkg
    prepare: {function: hy}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # I-11
  - id: hy_reverse_zero_rows
    function: hy_reverse
    fixture: hy_reverse_zero_rows.gpkg
    prepare: {function: hy}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # not_hy_object; changes_with: a10 (gains hydroloom_representation_error);
  # S-6 boundary; repeated id -> hy() gives hy_flownetwork, not hy
  - id: hy_reverse_flownetwork_raises
    function: hy_reverse
    fixture: duplicated_edge.gpkg
    prepare: {function: hy}
    args: {}
    compare: exact
    order: exact
