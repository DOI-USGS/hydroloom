  # hy_reverse ----------------------------------------------------------------
  # Every case but the last applies hy() first through prepare (D3-11); the
  # prepare args are hy()'s, and hy_reverse takes none. Column order and the
  # sf_column name are not visible in a layer; the testthat interface test
  # keeps those assertions.

  # changes_with: i2 (COMID et al. arrive double; integer after I-2, text-equal)
  - id: hy_reverse_new_hope
    function: hy_reverse
    fixture: new_hope.gpkg
    prepare: {function: hy}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # changes_with: i2; toid stays hydroloom-named; add_toids moved FromNode
  - id: hy_reverse_new_hope_add_topo
    function: hy_reverse
    fixture: new_hope.gpkg
    prepare: {function: hy, args: {add_topo: true}}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # changes_with: i2; non-vocabulary columns and geometry stay dropped
  - id: hy_reverse_new_hope_clean
    function: hy_reverse
    fixture: new_hope.gpkg
    prepare: {function: hy, args: {clean: true}}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # worked example; toID NA -> 0 (I-5) is not restored
  - id: hy_reverse_renamed
    function: hy_reverse
    fixture: hy_reverse_renamed.gpkg
    prepare: {function: hy}
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
