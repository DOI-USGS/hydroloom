# hydroloom conformance manifest (SPEC S-4); schema: manifest.schema.json
suite_version: 0.1.0
functions:
  hy:
    requires: algorithms/hy.md#requires
    returns: frame
  hy_reverse:
    requires: algorithms/hy_reverse.md#requires
    returns: frame
  is.hy:
    requires: algorithms/is.hy.md#requires
    returns: scalar
  # A named character vector becomes a frame of name, value in vector order
  # (D3-13).
  hydroloom_names:
    requires: algorithms/hydroloom_names.md#requires
    returns: frame
    key: [name, value]
cases:
  # hy ------------------------------------------------------------------------
  # Annotations from the proposed cases (D3-14) are kept as comments:
  # changes_with i2 = identifier ingest (ROADMAP §4, M3); python_omitted =
  # uses clean or add_topo, which as_hy omits (A-5).

  # changes_with: i2 (fromnode/tonode double -> integer)
  - id: hy_new_hope_default
    function: hy
    fixture: new_hope.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # python_omitted; changes_with: i2
  - id: hy_new_hope_clean
    function: hy
    fixture: new_hope.gpkg
    args: {clean: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # python_omitted; changes_with: i2 (toid double -> integer)
  - id: hy_new_hope_add_topo
    function: hy
    fixture: new_hope.gpkg
    args: {add_topo: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # python_omitted; changes_with: i2; warns nonunique_id_with_toid, 832 rows (flownetwork)
  - id: hy_new_hope_add_topo_no_divergence
    function: hy
    fixture: new_hope_no_divergence.gpkg
    args: {add_topo: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]
    raises: warning

  # changes_with: i2 (whole-valued double ids -> integer; NA toid -> 0L)
