  # is.hy ---------------------------------------------------------------------
  # The harness passes each fixture as read, so every R value is FALSE: a table
  # read from a file never carries the hy class. The TRUE path stays in
  # test_hydroloom.R. Annotations from the proposed cases (D3-14): shared: true
  # = R and the Python definition agree (add python to supported_by when
  # is_hy is ported); shared: false = the Python definition may return True.

  # shared: true; real NHDPlusV2 subset in source names; FALSE in both languages
  - id: is_hy_new_hope
    function: is.hy
    fixture: new_hope.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # shared: true; silent changes messages only, never the value
  - id: is_hy_new_hope_silent
    function: is.hy
    fixture: new_hope.gpkg
    args: {silent: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # shared: true; worked example; source names with an NA tocomid
  - id: is_hy_source_names
    function: is.hy
    fixture: is_hy_source_names.gpkg
    args: {silent: true}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

