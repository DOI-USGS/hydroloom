  # changes_with: i2; current R: vctrs cast error in the toid fill
  # (outlet_fill_type_mismatch); post-change both character, fill "", returns
  - id: hy_id_integer_toid_character
    function: hy
    fixture: hy_id_integer_toid_character.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]
    raises: error

  - id: hy_mixed_case_names
    function: hy
