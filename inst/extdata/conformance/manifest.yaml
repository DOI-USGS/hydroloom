# hydroloom conformance manifest (SPEC S-4); schema: manifest.schema.json
suite_version: 0.1.0
functions:
  hy:
    requires: algorithms/hy.md#requires
    returns: frame
  hy_reverse:
    requires: algorithms/hy_reverse.md#requires
    returns: frame
  is.hy:
    requires: algorithms/is.hy.md#requires
    returns: scalar
  align_names:
    requires: algorithms/align_names.md#requires
    returns: frame
  hydroloom_name_definitions:
    requires: algorithms/hydroloom_name_definitions.md#requires
    returns: frame
    key: [name]
  # A named character vector becomes a frame of name, value in vector order
  # (D3-13).
  hydroloom_names:
    requires: algorithms/hydroloom_names.md#requires
    returns: frame
    key: [name, value]
  hy_network_type:
    requires: algorithms/hy_network_type.md#requires
    returns: scalar
  # A named logical vector until A-4: a frame of name, value in vector order
  # (D3-13); after A-4, function, available, via.
  hy_capabilities:
    requires: algorithms/hy_capabilities.md#requires
    returns: frame
  is_dendritic:
    requires: algorithms/is_dendritic.md#requires
    returns: scalar
  add_toids:
    requires: algorithms/add_toids.md#requires
    returns: frame
