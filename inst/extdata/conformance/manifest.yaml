    order: exact
    supported_by: [r]
    generator: [r]

  - id: hy_toid_missing_character
    function: hy
    fixture: hy_toid_missing_character.gpkg
    args: {}
    compare: exact
    order: exact
    supported_by: [r]
    generator: [r]

  # changes_with: i2 (double beyond 32-bit -> character, id and toid together)
