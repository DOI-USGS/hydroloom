variables:
  _R_CHECK_CRAN_INCOMING_: "false"
  _R_CHECK_FORCE_SUGGESTS_: "true"
  _R_CHECK_DONTTEST_EXAMPLES_: "false"
  _R_CHECK_RD_XREFS_: "false"

stages:
  - check
  - build
  - verify
  - publish

# R releases run on rc/<version> branches; Python releases on rc/py-<version>
# branches (stage 1, TestPyPI) and py-v<version> tags (stage 2, PyPI).
# VERIFICATION 7.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^rc\//
    - if: $CI_COMMIT_TAG =~ /^py-v/

.r-base:
  tags:
    - chs-shared
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rocker/geospatial:latest
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^rc\/py-/
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^rc\//
  before_script:
    - wget --no-check-certificate -O /usr/local/share/ca-certificates/DOIRootCA2.crt https://raw.githubusercontent.com/dblodgett-usgs/hydrogeoenv/master/linux/DOIRootCA2.cer
    - chmod 644 /usr/local/share/ca-certificates/DOIRootCA2.crt && update-ca-certificates
    - apt-get update
    - apt-get install -y --no-install-recommends p7zip-full qpdf pandoc curl
    - export PATH="/usr/local/lib/R/site-library/littler/examples/:${PATH}"
    - echo "options(Ncpus = $(nproc --all))" >> /usr/local/lib/R/etc/Rprofile.site
    - r -e 'pak::local_install_dev_deps()'

check:
  extends: .r-base
  stage: check
  script:
    - R CMD build --no-build-vignettes --no-manual .
    - R CMD check --no-tests --no-examples --no-vignettes --no-manual *.tar.gz
  artifacts:
    paths:
      - "*.Rcheck"
    when: always

build:
  extends: .r-base
  stage: build
  script:
    - R CMD build .
    - PKG_FILE=$(ls *.tar.gz)
    - PKG_NAME=$(echo "$PKG_FILE" | sed 's/_.*//')
    - PKG_VERSION=$(echo "$PKG_FILE" | sed 's/.*_\(.*\)\.tar\.gz/\1/')
    - 'curl --silent --show-error --write-out "\nHTTP status: %{http_code}\n" --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$PKG_FILE" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${PKG_VERSION}/${PKG_FILE}"'
  artifacts:
    paths:
      - "*.tar.gz"

verify:
  extends: .r-base
  stage: verify
  script:
    - R CMD check --as-cran --no-manual *.tar.gz
  artifacts:
    paths:
      - "*.Rcheck"
    when: always

# Python. The wheel is built here and nowhere else (VERIFICATION 7). GIT_DEPTH
# 0 so hatch-vcs counts commits from the py-v* tag. DOI_ROOT_CA is a file-type
# CI variable holding the DOI root certificate; PYPI_TOKEN and TEST_PYPI_TOKEN
# are masked, protected variables, exposed only on protected rc/* branches and
# py-v* tags.
.py-base:
  tags:
    - chs-shared
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/condaforge/miniforge3:latest
  variables:
    GIT_DEPTH: 0
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # One bundle of the public roots plus the DOI root. Hosts the DOI proxy
  # inspects (pypi.org, test.pypi.org) present a chain signed by the DOI
  # root; upload.pypi.org is passed through and presents its public chain,
  # which the DOI certificate alone cannot verify.
  before_script:
    - cat "$(python -m certifi)" "$DOI_ROOT_CA" > /tmp/ca-bundle.pem
    - export SSL_CERT_FILE=/tmp/ca-bundle.pem REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem PIP_CERT=/tmp/ca-bundle.pem
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^rc\/py-/
    - if: $CI_COMMIT_TAG =~ /^py-v/

py-build:
  extends: .py-base
  stage: build
  script:
    - python -m pip install --quiet build twine check-wheel-contents
    - python -m build --outdir dist .
    - ls -l dist
    - twine check dist/*
    - check-wheel-contents dist/*.whl
  artifacts:
    paths:
      - dist/

# Conformance against the installed wheel, not the checkout: a venv with the
# wheel and the test dependencies, pytest run from the checkout so
# tests/python/conformance.py finds the manifest and fixtures by path. src/ is
# not on sys.path, so `import hydroloom` is the wheel.
py-verify:
  extends: .py-base
  stage: verify
  needs: ["py-build"]
  script:
    - python -m venv /tmp/clean
    - /tmp/clean/bin/python -m pip install --quiet dist/*.whl pytest hypothesis pyyaml numpydoc
    - /tmp/clean/bin/python -c "import hydroloom, pathlib; print(hydroloom.__version__, pathlib.Path(hydroloom.__file__).parent)"
    - /tmp/clean/bin/python -m pytest tests/python

py-publish:
  extends: .py-base
  stage: publish
  needs: ["py-build", "py-verify"]
  variables:
    GIT_DEPTH: 0
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    TWINE_USERNAME: __token__
    TWINE_NON_INTERACTIVE: "1"
  script:
    - python -m pip install --quiet twine
    # A protected variable reaches a job only on a protected ref: rc/* must be
    # a protected branch pattern and py-v* a protected tag pattern, or the
    # token arrives empty and TestPyPI answers 403.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export TWINE_PASSWORD="$PYPI_TOKEN"
        [ -n "$TWINE_PASSWORD" ] || { echo "PYPI_TOKEN is empty: is py-v* a protected tag pattern?"; exit 1; }
        twine upload --verbose dist/*
      else
        export TWINE_PASSWORD="$TEST_PYPI_TOKEN"
        [ -n "$TWINE_PASSWORD" ] || { echo "TEST_PYPI_TOKEN is empty: is rc/* a protected branch pattern?"; exit 1; }
        twine upload --verbose --repository-url https://test.pypi.org/legacy/ dist/*
      fi
