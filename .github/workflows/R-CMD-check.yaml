on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # pull-requests: read lets the path filter list a pull request's files.
    permissions:
      contents: read
      pull-requests: read
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_TESTS_NLINES_: 0
      NOT_CRAN: true
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # VERIFICATION 3: the job always starts and this step decides whether to
      # do the work. It skips only when every changed file is Python-only;
      # shared paths (inst/extdata/, pyproject.toml, pixi.lock) run the check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref_name }}
          predicate-quantifier: every
          filters: |
            r:
              - '**'
              - '!src/hydroloom/**'
              - '!tests/python/**'
              - '!hatch_build.py'
              - '!.pre-commit-config.yaml'
              - '!.github/workflows/py-test.yaml'
              - '!.github/workflows/py-min-versions.yaml'
              - '!.github/workflows/lint.yaml'

      - name: No R paths changed
        if: steps.filter.outputs.r != 'true'
        run: echo "No R or shared paths changed; nothing to check."

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.filter.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.filter.outputs.r == 'true'
        with:
            r-version: ${{ matrix.config.r }}
            use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.filter.outputs.r == 'true'
        with:
          # github hydrogeofetch until a CRAN release carries the new_hope_3dhp.R recipe
          extra-packages: any::rcmdcheck, any::covr, github::DOI-USGS/hydrogeofetch
          needs: check, coverage

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.filter.outputs.r == 'true'
        with:
          upload-snapshots: true

      - name: Test coverage
        if: steps.filter.outputs.r == 'true'
        run: covr::codecov()
        shell: Rscript {0}
